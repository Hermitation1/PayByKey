[project]
name = "pay_by_key"
version = "0.1.0"
description = "FastAPI dashboard for DeepSeek API cost monitoring — track token spending per API key with Plotly charts"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "pandas>=2.2.0",
    "plotly>=6.0.0",
    "python-multipart>=0.0.28",
    "ruff>=0.15.12",
    "slowapi>=0.1.9",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.0.0",
]
